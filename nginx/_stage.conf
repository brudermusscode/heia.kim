server {
    listen 80;
    listen [::]:80;

    server_name circlehub.uk;

    return 301 https://www.circlehub.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name circlehub.uk;

    include ssl_cert.conf;

    return 301 https://www.circlehub.uk$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name www.circlehub.uk;

	include ssl_cert.conf;

  root /var/opt/heiakim-frontend/public;
  index /yield.php;

  proxy_hide_header Access-Control-Allow-Origin;
  add_header 'Access-Control-Allow-Origin' '*' always;
  add_header 'Access-Control-Allow-Origin' 'storage.heia.kim';
  add_header 'Access-Control-Allow-Origin' 'user-content.heia.kim';

  #Error pages
  error_page 500 /yield.php?page=404;
  error_page 404 /yield.php?page=404;
  error_page 403 /yield.php?page=404;

  #PHP-FPM Configuration Nginx
  location ~ \.php$ {
    try_files            $uri =404;
    fastcgi_pass         php-handler;
    fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
	  fastcgi_read_timeout 300;
    include              fastcgi_params;
  }

  include /var/opt/heiakim-frontend/nginx/rewrites.conf;
}

# API
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name public-api.circlehub.uk;

	include ssl_cert.conf;

  root /var/opt/heiakim-frontend/public;
  index /requests/api/v1/index.php;

  #PHP-FPM Configuration Nginx
  location ~ \.php$ {
    try_files            $uri =404;
    fastcgi_pass         php-handler;
    fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
	  fastcgi_read_timeout 300;
    include              fastcgi_params;
  }

  include /var/opt/heiakim-frontend/nginx/rewrites-api.conf;
}

# ASSETS
server {
	listen 443 ssl;
  listen [::]:443 ssl;

	server_name storage.circlehub.uk;

	include ssl_cert.conf;

  root /var/opt/heiakim-frontend/public/assets;
  index index.html;

  location ~ ^/(fonts|images|icons|javascript|sounds|stylesheets|videos)/* {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
  }
}

# USERCONTENT
server {
	listen 443 ssl;
  listen [::]:443 ssl;

	server_name user-content.circlehub.uk;

	include ssl_cert.conf;

  root /var/opt/heiakim-frontend/public/data;
  index index.html;

  location ~ ^/(squads|users)/* {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
  }
}