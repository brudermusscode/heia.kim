    proxy_hide_header X-Powered-By;

    #Prevent clickjacking attacks. This disables the option to render the page in a frame or iframe.
    add_header X-Frame-Options "SAMEORIGIN";

    #Only connect through HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";

    #Protects against certain types of attacks, including Cross-site Scripting attacks (XSS) and data injection attacks.
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header X-XSS-Protection "1; mode=block";

    #Only allow newer TLS versions.
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384;

    #The order of cipher suites matters
    ssl_prefer_server_ciphers off;