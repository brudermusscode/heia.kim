networks:
  default:
    name: dev-bridge
    driver: local
    external: true

x-env: &x-env
  environment:
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    MYSQL_HOST: ${MYSQL_HOST}
    MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}

x-web: &x-web
  <<: *x-env
  build: .
  restart: always
  tty: true
  volumes_from:
    - php

services:
  php:
    container_name: frontend-php
    restart: always
    build: ./docker/dev/php
    volumes:
      - .:/data

  web:
    <<: *x-web
    container_name: frontend-web
    ports:
      - ${WEB_PORT}:80
    command: ["nginx"]
    entrypoint: ["/wait-for-it.sh", "frontend-php:9000", "--", "/data/docker/entrypoint.sh"]

  api:
    <<: *x-web
    container_name: frontend-api
    ports:
      - ${API_PORT}:80
    command: ["api"]
    entrypoint: ["/wait-for-it.sh", "frontend-php:80", "--", "/data/docker/entrypoint.sh"]

  # jobs:
  #   <<: *x-web
  #   volumes_from:
  #     - php
  #   command: ["jobs"]
  #   depends_on:
  #     - php

  node:
    image: node:26.2-trixie-slim
    working_dir: /data
    restart: always
    command: npm run dev
    environment:
      NODE_ENV: "development"
      WATCHPACK_POLLING: "true"
      NODE_BUNDLE_DEV_ENTRY_FILE: ${NODE_BUNDLE_DEV_ENTRY_FILE}
      NODE_BUNDLE_OUTPUT_PATH: ${NODE_BUNDLE_OUTPUT_PATH}
      NODE_BUNDLE_OUTPUT_FILENAME: ${NODE_BUNDLE_OUTPUT_FILENAME}
      NODE_BUNDLE_OUTPUT_PUBLIC_PATH: ${NODE_BUNDLE_OUTPUT_PUBLIC_PATH}
      NODE_DEVSERVER_HOST: ${NODE_DEVSERVER_HOST}
      NODE_DEVSERVER_PORT: ${NODE_DEVSERVER_PORT}
      NODE_DEVSERVER_STATIC: ${NODE_DEVSERVER_STATIC}
      NODE_DEVSERVER_PROXY_ROOT: ${NODE_DEVSERVER_PROXY_ROOT}
    volumes_from:
      - php
    depends_on:
      - web
    ports:
      - "${NODE_DEVSERVER_PORT}:${NODE_DEVSERVER_PORT}"
